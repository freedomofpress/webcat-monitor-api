# /etc/nginx/sites-enabled/webcat-monitor; HOSTNAME is filled in by setup.sh, certbot adds TLS and the redirect
server {
    listen 80;
    listen [::]:80;
    server_name HOSTNAME;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }
}
