# The only configuration. One [[source]] per log; `type` picks the fetcher. Keys are pinned: a rotation fails verification.

[paths]
index = "/srv/index"      # NVMe: ClickHouse, Sigsum SQLite, state
archive = "/srv/archive"  # HDD: archives

[gcp]  # Rekor v1 via Google's BigQuery dataset; service account roles: bigquery.jobUser, bigquery.dataEditor, bucket objectAdmin
project = "webcat-511408"
dataset = "rekor_export"
bucket = "gs://webcat-511408-rekor-export"
credentials = "/srv/index/gcloud"
export_snapshot = "2026-10-18T10:41:00Z"  # start of the one-time export; daily increments continue from here

[api]
bind = "127.0.0.1"
port = 8080
hostname = "monitor-api.webcat.tech"  # nginx in front, Let's Encrypt certificate (setup.sh)

